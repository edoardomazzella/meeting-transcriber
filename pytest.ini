[pytest]
testpaths = tests
markers =
    qt:           tests that require a Qt application context (QApplication must exist)
    filesystem:   tests that exercise filesystem paths via tmp_path
    slow:         tests that download or load AI models — may take minutes; excluded from fast CI
    audio:        tests that require real audio hardware (soundcard/WASAPI) — excluded from CI
    requires_gpu: tests that require an NVIDIA GPU with CUDA — excluded from CI without GPU agent
